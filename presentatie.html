  --tomato:#6a46d4; --on-tomato:#ffffff; --sun:#ffc531; --basil:#17835a; --on-basil:#ffffff;
  --dough:#e8c58a; --dough-soft:#f3e3c1; --blue:#2a62ff; --bad:#fdeceb; --good:#e3f6ec;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eef0ff; --paper:#121629; --card:#1c2240; --line:#323a63; --soft:#262d52; --muted:#aab2d8;
    --tomato:#a996ff; --on-tomato:#1a1038; --basil:#3cc593; --on-basil:#0b2a1f;
    --dough-soft:#3a3550; --blue:#8aa8ff; --bad:#3b2230; --good:#17332b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#eef0ff; --paper:#121629; --card:#1c2240; --line:#323a63; --soft:#262d52; --muted:#aab2d8;
  --tomato:#a996ff; --on-tomato:#1a1038; --basil:#3cc593; --on-basil:#0b2a1f;
  --dough-soft:#3a3550; --blue:#8aa8ff; --bad:#3b2230; --good:#17332b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding:16px 16px calc(72px + env(safe-area-inset-bottom));padding-top:calc(16px + env(safe-area-inset-top))}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0 0 .5em;text-wrap:balance}
h1{font-size:2.3rem} h2{font-size:1.55rem} h3{font-size:1.25rem}
p{margin:0 0 .8em}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:var(--display);font-weight:700;font-size:1.4rem;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--sun) 0 22%,var(--tomato) 24% 100%);border:3px solid var(--dough)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn,button{font-family:var(--display);font-weight:600;font-size:1.05rem;min-height:52px;padding:0 20px;border-radius:14px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;touch-action:manipulation}
.btn.small,button.small{min-height:44px;padding:0 14px;font-size:1rem}
.primary{background:var(--tomato);border-color:var(--tomato);color:var(--on-tomato)}
.ghost{background:transparent}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}
.tag{display:inline-block;font-family:var(--display);font-weight:600;font-size:.85rem;padding:2px 12px;border-radius:99px;margin-bottom:10px;background:var(--soft);color:var(--ink)}
.tag.probeer{background:var(--sun);color:#1c2340}
.tag.ontdek{background:var(--blue);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.ontdek{color:#10163a}}
:root[data-theme="dark"] .tag.ontdek{color:#10163a}
.tag.samen{background:var(--basil);color:var(--on-basil)}
.tag.denk{background:var(--dough);color:#1c2340}
.done-badge{float:right;font-family:var(--display);font-weight:600;background:var(--basil);color:var(--on-basil);border-radius:99px;padding:2px 14px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
textarea,input[type=text]{width:100%;font-family:var(--body);font-size:18px;line-height:1.5;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{resize:vertical;min-height:120px}
.bad,.good{border-radius:14px;padding:10px 14px;margin:0 0 12px}
.bad{background:var(--bad)} .good{background:var(--good)}
.tip{background:var(--soft);border-left:6px solid var(--sun);border-radius:12px;padding:10px 14px;margin-top:12px}
.status{min-height:1.5em;margin:10px 0 0;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{min-height:44px;padding:0 16px;font-size:1rem;border-radius:99px;border-style:dashed;border-color:var(--muted);color:var(--muted);background:transparent}
.chip.needed{border-style:solid;border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--basil);border-color:var(--basil);color:var(--on-basil);border-style:solid}
.hintline{font-size:.95rem;color:var(--muted);margin:8px 0 0}
.opt{display:block;width:100%;text-align:left;justify-content:flex-start;margin-bottom:10px;min-height:56px;padding:10px 18px;font-family:var(--body);font-weight:700;font-size:1.05rem;line-height:1.35}
.opt.right{background:var(--basil);border-color:var(--basil);color:var(--on-basil)}
.opt.wrong{background:var(--bad);border-color:var(--tomato)}
.opt.sel{border-color:var(--blue);box-shadow:inset 0 0 0 3px var(--blue)}
.fb{margin:6px 0 0;font-weight:700}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--basil);border-radius:99px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:20px;align-items:center}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.pizza{width:100%;max-width:260px;height:auto;margin:0 auto;display:block}
.pizza a{cursor:pointer}
.pizza text{font-family:var(--display);font-weight:700;font-size:20px;pointer-events:none}
.lessons{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.lesson{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px}
.lesson:hover{border-color:var(--ink)}
.num{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.5rem;background:var(--dough-soft);color:#1c2340;border:3px solid var(--dough)}
.lesson.finished .num{background:var(--tomato);border-color:var(--tomato);color:var(--on-tomato)}
.lesson b{font-family:var(--display);font-size:1.15rem;display:block;line-height:1.2}
.lesson small{display:block;color:var(--muted);font-size:.95rem}
.lesson .bar{margin-top:8px}
.go{font-family:var(--display);font-weight:600;color:var(--muted);white-space:nowrap}
.layers{display:flex;flex-direction:column;align-items:center;gap:6px;margin:14px 0 4px}
.layer{border-radius:18px;padding:8px 16px;color:#1c2340;min-width:min(100%,270px);text-align:center;transition:opacity .2s}
.layer b{font-family:var(--display);font-size:1.1rem}
.layer span{display:block;font-size:.95rem;line-height:1.3}
.layer.dim{opacity:.35}
.l-toppings{background:#7fd1a8}.l-kaas{background:#ffd75e}.l-saus{background:#f08a78}.l-bodem{background:#e8c58a}
ul,ol{padding-left:1.3em;margin:0 0 .8em} li{margin-bottom:.35em}
.checkrow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;justify-content:flex-start;min-height:56px;padding:10px 16px;margin-bottom:8px;font-family:var(--body);font-weight:700;font-size:1.05rem;line-height:1.35}
.box{flex:0 0 28px;width:28px;height:28px;border-radius:8px;border:3px solid var(--ink);display:grid;place-items:center;font-size:1rem;margin-top:1px}
.checkrow.on .box{background:var(--basil);border-color:var(--basil);color:var(--on-basil)}
.log{border-top:2px solid var(--line);padding-top:12px;margin-top:12px}
.log pre{white-space:pre-wrap;word-break:break-word;font-family:var(--body);font-size:1rem;margin:6px 0;background:var(--paper);border-radius:12px;padding:10px 12px}
.diploma{text-align:center;border:6px double var(--dough);border-radius:24px;padding:32px 20px;background:var(--card)}
.diploma h1{font-size:2.6rem}
.foot{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.foot a{color:var(--muted);font-weight:700}
.lessonnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
@media (prefers-reduced-motion: no-preference){.bar>span{transition:width .4s}}

.path{width:100%;max-width:340px;height:auto;margin:0 auto;display:block}
.path a{cursor:pointer}
.path text{font-family:var(--display);font-weight:700;font-size:18px;pointer-events:none}
.flabel{display:block;font-family:var(--display);font-weight:600;margin:12px 0 4px}
.goals{list-style:none;padding:0;margin:0 0 8px}
.goals li{display:flex;gap:10px;margin-bottom:6px;align-items:flex-start}
.goals .gm{flex:0 0 24px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--muted);font-size:.85rem;margin-top:2px;color:var(--muted)}
.goals li.ok .gm{background:var(--basil);border-color:var(--basil);color:var(--on-basil)}
.chrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,190px) auto;gap:8px;margin-top:10px;align-items:center}
@media (max-width:640px){.chrow{grid-template-columns:1fr}}
select{font-family:var(--body);font-size:18px;min-height:52px;border:2px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:0 10px;width:100%}
.player{border-radius:24px;padding:24px 20px;margin-bottom:16px}
.player .ptitle{font-family:var(--display);font-weight:600;opacity:.8;margin:0 0 12px}
.player .story{font-size:1.25rem;line-height:1.6;white-space:pre-wrap}
.player h2{margin-top:8px}
.pc{display:block;width:100%;text-align:left;justify-content:flex-start;margin-top:10px;min-height:56px;padding:10px 18px;background:rgba(255,255,255,.14);color:inherit;border-color:currentColor;font-family:var(--body);font-weight:800;font-size:1.1rem}
.pg{background:transparent;color:inherit;border-color:currentColor}
.scene textarea{min-height:100px}

.thumb{display:block;max-width:220px;max-height:160px;width:auto;height:auto;border-radius:12px;border:2px solid var(--line);margin:12px 0 0}
.deckplayer{margin-bottom:16px}
.slide{position:relative;aspect-ratio:16/9;border-radius:20px;padding:5%;display:flex;gap:4%;align-items:center;overflow:hidden}
.slide .sl-body{flex:1 1 0;min-width:0}
.slide .sl-title{font-size:clamp(1.3rem,5.2vw,2.8rem);margin:0 0 .4em;line-height:1.1}
.slide .sl-text{font-size:clamp(1rem,3vw,1.6rem);line-height:1.4;white-space:pre-wrap;margin:0}
.slide .sl-img{flex:0 0 42%;height:100%;display:flex;align-items:center;justify-content:center}
.slide .sl-img img{max-width:100%;max-height:100%;border-radius:12px}
.slide .sl-deck{position:absolute;left:5%;bottom:3%;font-size:.8rem;opacity:.7}
.ctl{justify-content:space-between;margin-top:14px}
.cnt{font-family:var(--display);font-weight:600;color:var(--muted)}
@media (max-width:520px){.slide{aspect-ratio:auto;min-height:60vw;flex-direction:column;align-items:flex-start;padding:6%}.slide .sl-img{flex:none;height:auto;width:100%}.slide .sl-deck{position:static}}
</style>

var STEPS={};

function $(id){return document.getElementById(id);}
var RX={
 bodem:/\b(bedenk|bedenken|schrijf|schrijven|maak|maken|leg|geef|vertel|teken|verzin|help|noem|vergelijk|stel|laat|bouw|plan|ontwerp|kun je|kan je|oefenen|oefen)\b/,
 saus:/\b(ik ben|ik zit|ik heb|ik wil|ik vind|ik ga|alsof ik|mijn|voor mij|voor een|voor de|omdat|zodat)\b/,
 kaas:/(bijvoorbeeld|zoals|voorbeeld|zo'n|zo een|net als|in de stijl|stijl van)/,
 toppings:/(\d|\bkort|\blang|grappig|spannend|makkelijk|simpel|eenvoudig|woorden|zinnen|regels|\bniet\b|\bgeen\b|maximaal|minimaal|alinea|stappen|rijm|onder|zonder|dia's)/
};
function detect(t){t=(t||"").toLowerCase();return {bodem:RX.bodem.test(t),saus:RX.saus.test(t),kaas:RX.kaas.test(t),toppings:RX.toppings.test(t)};}
function eff(key,layer,auto){var m=S.manual[key];return (m&&m[layer]!==undefined)?m[layer]:auto[layer];}
function draftOf(key){var e=STEPS[key];if(S.drafts[key]!==undefined)return S.drafts[key];return e.s.start||"";}

function stats(){
 var d=S.deck,sl=d.slides,t=0,x=0,im=0;
 sl.forEach(function(s){if((s.title||"").trim().length>=2)t++;if((s.text||"").trim().length>=10)x++;if(s.img)im++;});
 return {slides:sl.length,titled:t,texted:x,imgs:im,title:(d.title||"").trim().length>=2,theme:!!d.themeSet};
}
function reqs(g){
 var s=stats(),r=[];
 if(g.minSlides)r.push({ok:s.slides>=g.minSlides,label:"Minstens "+g.minSlides+" dia's (nu "+s.slides+")"});
 if(g.needAllTitle)r.push({ok:s.titled===s.slides,label:"Elke dia heeft een titel ("+s.titled+" van "+s.slides+")"});
 if(g.needAllText)r.push({ok:s.texted===s.slides,label:"Elke dia heeft een paar woorden tekst ("+s.texted+" van "+s.slides+")"});
 if(g.minImages)r.push({ok:s.imgs>=g.minImages,label:"Minstens "+g.minImages+" dia's met een plaatje (nu "+s.imgs+")"});
 if(g.needTitle)r.push({ok:s.title,label:"Je presentatie heeft een titel"});
 if(g.needTheme)r.push({ok:s.theme,label:"Je hebt een thema gekozen"});
 return r;
}
function stepDone(key){var e=STEPS[key];if(e&&e.s.t==="deckgoal")return reqs(e.s).every(function(x){return x.ok;});return !!S.done[key];}
function progress(L){var t=0,d=0;L.steps.forEach(function(s){if(s.id){t++;if(stepDone(L.id+"-"+s.id))d++;}});return {t:t,d:d};}
function lessonFinished(L){var p=progress(L);return p.d===p.t;}
function allFinished(){return LESSONS.every(lessonFinished);}
function pct(L){var p=progress(L);return Math.round(100*p.d/p.t);}

function processImage(file,i){
 var st=function(m){say("im-"+i,m);};
 if(!file||!/^image\//.test(file.type)){st("Kies een plaatje (een foto of een afbeelding).");return;}
 st("Plaatje wordt klaargemaakt...");
 var fr=new FileReader();
 fr.onerror=function(){st("Dit plaatje kon niet worden gelezen. Probeer een ander plaatje.");};
 fr.onload=function(){
  var im=new Image();
  im.onerror=function(){st("Dit plaatje kon niet worden geopend. Probeer een ander plaatje.");};
  im.onload=function(){
   var max=800,w=im.width,h=im.height,sc=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
   var c=document.createElement("canvas");c.width=w;c.height=h;var ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(im,0,0,w,h);
   var url=c.toDataURL("image/jpeg",0.7),old=S.deck.slides[i].img;
   S.deck.slides[i].img=url;
   if(!save()){S.deck.slides[i].img=old;st("Er is geen ruimte meer op deze iPad voor nog een plaatje. Haal eerst een plaatje weg bij een andere dia.");return;}
   render(true);
  };
  im.src=fr.result;
 };
 fr.readAsDataURL(file);
}

 "<h3>De pizza-robot</h3><p>Onder elke prompt zoekt een eenvoudig programma naar de lagen van de Prompt-Pizza. Het kijkt alleen naar bepaalde woorden en kan zich vergissen. Het kind kan elke laag zelf aan of uit zetten.</p>"+
 "<h3>Plaatjes</h3><p>Plaatjes kiezen de kinderen uit de foto's of bestanden op de iPad. Ze worden kleiner gemaakt en alleen op dit apparaat bewaard. Kijk samen of ze geen foto's van echte mensen gebruiken.</p>"+
 "<h3>ChatGPT en leeftijd</h3><p>OpenAI zegt dat ChatGPT niet bedoeld is voor kinderen onder 13, en ouderlijk toezicht is er alleen voor gekoppelde tienerrekeningen vanaf 13. Zit er daarom bij en lees de actuele voorwaarden. Hoe jullie hiermee omgaan is jouw keuze.</p>"+
 "<h3>Voortgang</h3><p>Voortgang, logboek en dia's staan alleen op dit apparaat, in deze browser. Wis je de browsergegevens, dan zijn ze weg.</p>"+
 "<div id=\"resetbox\"><button data-act=\"reset1\">Alles wissen</button></div></section>";
}
function diplomaView(){
 if(!allFinished())return "<section class=\"card\"><h2>Nog niet klaar</h2><p>Maak eerst alle "+N+" lessen af.</p><a class=\"btn primary\" href=\"#start\">Naar de kaart</a></section>";
 var d=new Date().toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"});
 return "<section class=\"diploma\"><p style=\"font-weight:700;color:var(--muted)\">Dit diploma is voor</p><h1>"+esc(S.name)+"</h1><h2>Presentator</h2>"+
 "<p>Je hebt een onderwerp gekozen, er met ChatGPT over geleerd, een verhaal gebouwd, plaatjes gemaakt, dia's gemaakt en je presentatie laten zien.</p>"+
 "<p><b>"+esc(S.deck.title||"")+"</b></p><p><b>"+d+"</b></p><p style=\"color:var(--muted)\">Maak een schermafbeelding om dit diploma te bewaren.</p></section>"+
 "<div class=\"row\" style=\"justify-content:center\"><a class=\"btn\" href=\"#speeltuin\">Bekijk je presentatie</a><a class=\"btn\" href=\"#start\">Naar de kaart</a></div>";
}

/* ---------- render ---------- */
var lastRoute=null;
function route(){return (location.hash||"").replace("#","")||"start";}
function render(keep){
 var r=route(),app=$("app"),y=window.scrollY;
 if(!S.rules&&r!=="ouders"&&r!=="spelregels"){app.innerHTML=onboarding();lastRoute=r;return;}
 var m=/^les-(\d+)$/.exec(r);
 if(r!=="speeltuin")play=null;
 if(m)app.innerHTML=lessonView(parseInt(m[1],10));
 else if(r==="speeltuin")app.innerHTML=deckView();
 else if(r==="logboek")app.innerHTML=logView();
 else if(r==="spelregels")app.innerHTML=rulesView();
 else if(r==="ouders")app.innerHTML=parentsView();
 else if(r==="diploma")app.innerHTML=diplomaView();
 else app.innerHTML=homeView();
 if(keep||lastRoute===r)window.scrollTo(0,y);else window.scrollTo(0,0);
 lastRoute=r;
}
window.addEventListener("hashchange",function(){render(false);});

/* ---------- actions ---------- */
function say(id,msg){var e=$(id);if(e)e.textContent=msg;}
function updateChips(key){var c=$("chips-"+key);if(c)c.innerHTML=chipsHTML(key);}
document.addEventListener("input",function(e){
 var t=e.target;if(!t.matches)return;
 if(t.matches("textarea[data-key]")){var key=t.getAttribute("data-key");S.drafts[key]=t.value;save();updateChips(key);}
 else if(t.matches("textarea[data-rkey]")){var k=t.getAttribute("data-rkey");var a=S.ans[k]||{c:null,t:""};a.t=t.value;S.ans[k]=a;save();}
 else if(t.matches("input[data-fkey]")){var fk=t.getAttribute("data-fkey"),fi=parseInt(t.getAttribute("data-fi"),10);var arr=Array.isArray(S.ans[fk])?S.ans[fk]:[];arr[fi]=t.value;S.ans[fk]=arr;save();}
 else if(t.id==="dtt"){S.deck.title=t.value;save();}
 else if(t.matches("input[data-dt]")){S.deck.slides[parseInt(t.getAttribute("data-dt"),10)].title=t.value;save();}
 else if(t.matches("textarea[data-dx]")){S.deck.slides[parseInt(t.getAttribute("data-dx"),10)].text=t.value;save();}
});
document.addEventListener("change",function(e){
 var t=e.target;if(t.matches&&t.matches("input[data-img]")){var i=parseInt(t.getAttribute("data-img"),10);var f=t.files&&t.files[0];t.value="";processImage(f,i);}
});
document.addEventListener("keydown",function(e){
 if(!play)return;var n=S.deck.slides.length;
 if(e.key==="ArrowRight"&&play.at<n-1){play.at++;render(false);}
 else if(e.key==="ArrowLeft"&&play.at>0){play.at--;render(false);}
 else if(e.key==="Escape"){play=null;render(false);}
});
function copyFrom(text,ta,stId,okMsg){
 var done=function(){say(stId,okMsg||"Gekopieerd! Plak hem nu in ChatGPT.");};
 var fail=function(){if(ta){ta.focus();ta.setSelectionRange(0,99999);}say(stId,"Tik op de geselecteerde tekst en kies Kopieer.");};
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fail);}else{fail();}}catch(err){fail();}
}
document.addEventListener("click",function(e){
 var b=e.target.closest?e.target.closest("[data-act]"):null;if(!b)return;
 var act=b.getAttribute("data-act"),key=b.getAttribute("data-key"),i=parseInt(b.getAttribute("data-i"),10);
 if(act==="agree"){var on=b.classList.toggle("on");b.setAttribute("aria-pressed",on);b.querySelector(".box").textContent=on?"✓":"";return;}
 if(act==="start"){
  var nm=($("nm").value||"").trim();var ag=$("agree").classList.contains("on");
  if(!nm){say("obst","Vul eerst je naam in.");return;}
  if(!ag){say("obst","Tik eerst op het vakje om te beloven dat je de spelregels volgt.");return;}
  S.name=nm;S.rules=true;save();try{localStorage.setItem(PK,JSON.stringify({name:nm}));}catch(e){}if(route()!=="start")location.hash="#start";render(false);return;
 }
 if(act==="quiz"){
  var s=STEPS[key].s;var fb=$("fb-"+key);
  if(i===s.ok){S.done[key]=true;save();render(true);}
  else{b.classList.add("wrong");if(fb)fb.textContent="Nog niet. Probeer een ander antwoord.";}
  return;
 }
 if(act==="layer"){
  var l=b.getAttribute("data-layer");var auto=detect(draftOf(key));var cur=eff(key,l,auto);
  S.manual[key]=S.manual[key]||{};S.manual[key][l]=!cur;save();updateChips(key);return;
 }
 if(act==="copy"){var ta=$("ta-"+key);copyFrom(ta.value,ta,"st-"+key);return;}
 if(act==="savep"){
  var e2=STEPS[key],s2=e2.s,ta2=$("ta-"+key),text=ta2.value.trim(),au=detect(text);
  if(text.length<(s2.min||10)){say("st-"+key,"Schrijf nog wat meer. Een goede prompt is meestal een of twee zinnen.");return;}
  if(s2.forbid&&s2.forbid.some(function(f){return text.indexOf(f)>=0;})){say("st-"+key,s2.forbidMsg);return;}
  var miss=(s2.need||[]).filter(function(l2){return !eff(key,l2,au);});
  if(miss.length){say("st-"+key,"Nog niet klaar. Er mist nog: "+miss.map(function(l3){return LAYERS[l3].n.toLowerCase()+". "+LAYERS[l3].hint;}).join(" "));return;}
  S.drafts[key]=text;S.done[key]=true;
  var entry={key:key,lesson:e2.L.id,title:s2.title,text:text,d:new Date().toISOString()};
  var found=false;S.log=S.log.map(function(x){if(x.key===key){found=true;return entry;}return x;});if(!found)S.log.push(entry);
  save();render(true);return;
 }
 if(act==="off"){if(S.done[key])delete S.done[key];else S.done[key]=true;save();render(true);return;}
 if(act==="rc"){var a=S.ans[key]||{c:null,t:""};a.c=i;S.ans[key]=a;save();render(true);return;}
 if(act==="rsave"){
  var s3=STEPS[key].s,a3=S.ans[key]||{c:null,t:""},ta3=document.querySelector("textarea[data-rkey=\""+key+"\"]");if(ta3)a3.t=ta3.value;
  if(s3.choices&&s3.choices.length){if(a3.c===null){say("st-"+key,"Kies eerst een antwoord.");return;}}
  else if((a3.t||"").trim().length<5){say("st-"+key,"Schrijf nog wat meer op.");return;}
  S.ans[key]=a3;S.done[key]=true;save();render(true);return;
 }
 if(act==="fsave"){
  var fs=STEPS[key].s,fa=Array.isArray(S.ans[key])?S.ans[key]:[];
  for(var q=0;q<fs.fields.length;q++){if((fa[q]||"").trim().length<3){say("st-"+key,"Vul bij "+fs.fields[q].l+" nog iets in.");return;}}
  S.done[key]=true;save();render(true);return;
 }
 if(act==="chk"){
  var arr=S.checks[key]||[];arr[i]=!arr[i];S.checks[key]=arr;
  var n=STEPS[key].s.items.length,all=true;for(var z=0;z<n;z++){if(!arr[z])all=false;}
  if(all)S.done[key]=true;else delete S.done[key];save();render(true);return;
 }
 if(act==="copylog"){var ent=S.log.filter(function(x){return x.key===key;})[0];if(ent)copyFrom(ent.text,null,"logst");return;}
 /* speeltuin */
 if(act==="theme"){S.deck.theme=b.getAttribute("data-k");S.deck.themeSet=true;save();render(true);return;}
 if(act==="sadd"){S.deck.slides.push({title:"",text:"",img:""});save();render(true);return;}
 if(act==="sdel"){
  if(!b.getAttribute("data-sure")){b.setAttribute("data-sure","1");b.textContent="Zeker? Tik nog eens";return;}
  S.deck.slides.splice(i,1);save();render(true);return;
 }
 if(act==="up"&&i>0){var sl=S.deck.slides;var tmp=sl[i-1];sl[i-1]=sl[i];sl[i]=tmp;save();render(true);return;}
 if(act==="down"&&i<S.deck.slides.length-1){var sl2=S.deck.slides;var tmp2=sl2[i+1];sl2[i+1]=sl2[i];sl2[i]=tmp2;save();render(true);return;}
 if(act==="imgdel"){S.deck.slides[i].img="";save();render(true);return;}
 if(act==="play"){play={at:0};render(false);return;}
 if(act==="pstop"){play=null;render(false);return;}
 if(act==="pnext"){if(play.at<S.deck.slides.length-1)play.at++;render(false);return;}
 if(act==="pprev"){if(play.at>0)play.at--;render(false);return;}
 if(act==="reset1"){$("resetbox").innerHTML="<p><b>Weet je zeker dat je alles wilt wissen?</b> Dit kan niet ongedaan worden gemaakt.</p><button class=\"primary\" data-act=\"reset2\">Ja, alles wissen</button> <button data-act=\"reset0\">Nee, terug</button>";return;}
 if(act==="reset0"){$("resetbox").innerHTML="<button data-act=\"reset1\">Alles wissen</button>";return;}
 if(act==="reset2"){S=defaults();save();try{localStorage.removeItem(PK);}catch(e){}location.hash="#start";render(false);return;}
});
render(false);
})();

</script>
</body>
</html>
