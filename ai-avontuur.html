<style>
/* Plan: werkboek-gevoel voor 9-11 jaar. Inktblauw, tomaat, zon-geel, basilicum-groen, deeg.
   Layout: een brede kolom, grote tikvlakken voor iPad, een pizza als voortgangskaart. */
:root{
  --ink:#1c2340; --paper:#f1f4ff; --card:#ffffff; --line:#d9deef; --soft:#e9edfb; --muted:#566086;
  --tomato:#d23b25; --on-tomato:#ffffff; --sun:#ffc531; --basil:#17835a; --on-basil:#ffffff;
  --dough:#e8c58a; --dough-soft:#f3e3c1; --blue:#2a62ff; --bad:#fdeceb; --good:#e3f6ec;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eef0ff; --paper:#121629; --card:#1c2240; --line:#323a63; --soft:#262d52; --muted:#aab2d8;
    --tomato:#ff6a52; --on-tomato:#1c1209; --basil:#3cc593; --on-basil:#0b2a1f;
    --dough-soft:#3a3550; --blue:#8aa8ff; --bad:#3b2230; --good:#17332b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#eef0ff; --paper:#121629; --card:#1c2240; --line:#323a63; --soft:#262d52; --muted:#aab2d8;
  --tomato:#ff6a52; --on-tomato:#1c1209; --basil:#3cc593; --on-basil:#0b2a1f;
  --dough-soft:#3a3550; --blue:#8aa8ff; --bad:#3b2230; --good:#17332b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding:16px 16px calc(72px + env(safe-area-inset-bottom));padding-top:calc(16px + env(safe-area-inset-top))}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0 0 .5em;text-wrap:balance}
h1{font-size:2.3rem} h2{font-size:1.55rem} h3{font-size:1.25rem}
p{margin:0 0 .8em}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:var(--display);font-weight:700;font-size:1.4rem;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--sun) 0 22%,var(--tomato) 24% 100%);border:3px solid var(--dough)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn,button{font-family:var(--display);font-weight:600;font-size:1.05rem;min-height:52px;padding:0 20px;border-radius:14px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;touch-action:manipulation}
.btn.small,button.small{min-height:44px;padding:0 14px;font-size:1rem}
.primary{background:var(--tomato);border-color:var(--tomato);color:var(--on-tomato)}
.ghost{background:transparent}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}
.tag{display:inline-block;font-family:var(--display);font-weight:600;font-size:.85rem;padding:2px 12px;border-radius:99px;margin-bottom:10px;background:var(--soft);color:var(--ink)}
.tag.probeer{background:var(--sun);color:#1c2340}
.tag.ontdek{background:var(--blue);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.ontdek{color:#10163a}}
:root[data-theme="dark"] .tag.ontdek{color:#10163a}
.tag.samen{background:var(--basil);color:var(--on-basil)}
.tag.denk{background:var(--dough);color:#1c2340}
.done-badge{float:right;font-family:var(--display);font-weight:600;background:var(--basil);color:var(--on-basil);border-radius:99px;padding:2px 14px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
textarea,input[type=text]{width:100%;font-family:var(--body);font-size:18px;line-height:1.5;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{resize:vertical;min-height:120px}
.bad,.good{border-radius:14px;padding:10px 14px;margin:0 0 12px}
.bad{background:var(--bad)} .good{background:var(--good)}
.tip{background:var(--soft);border-left:6px solid var(--sun);border-radius:12px;padding:10px 14px;margin-top:12px}
.status{min-height:1.5em;margin:10px 0 0;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{min-height:44px;padding:0 16px;font-size:1rem;border-radius:99px;border-style:dashed;border-color:var(--muted);color:var(--muted);background:transparent}
.chip.needed{border-style:solid;border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--basil);border-color:var(--basil);color:var(--on-basil);border-style:solid}
.hintline{font-size:.95rem;color:var(--muted);margin:8px 0 0}
.opt{display:block;width:100%;text-align:left;justify-content:flex-start;margin-bottom:10px;min-height:56px;padding:10px 18px;font-family:var(--body);font-weight:700;font-size:1.05rem;line-height:1.35}
.opt.right{background:var(--basil);border-color:var(--basil);color:var(--on-basil)}
.opt.wrong{background:var(--bad);border-color:var(--tomato)}
.opt.sel{border-color:var(--blue);box-shadow:inset 0 0 0 3px var(--blue)}
.fb{margin:6px 0 0;font-weight:700}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--basil);border-radius:99px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:20px;align-items:center}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.pizza{width:100%;max-width:260px;height:auto;margin:0 auto;display:block}
.pizza a{cursor:pointer}
.pizza text{font-family:var(--display);font-weight:700;font-size:20px;pointer-events:none}
.lessons{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.lesson{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px}
.lesson:hover{border-color:var(--ink)}
.num{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.5rem;background:var(--dough-soft);color:#1c2340;border:3px solid var(--dough)}
.lesson.finished .num{background:var(--tomato);border-color:var(--tomato);color:var(--on-tomato)}
.lesson b{font-family:var(--display);font-size:1.15rem;display:block;line-height:1.2}
.lesson small{display:block;color:var(--muted);font-size:.95rem}
.lesson .bar{margin-top:8px}
.go{font-family:var(--display);font-weight:600;color:var(--muted);white-space:nowrap}
.layers{display:flex;flex-direction:column;align-items:center;gap:6px;margin:14px 0 4px}
.layer{border-radius:18px;padding:8px 16px;color:#1c2340;min-width:min(100%,270px);text-align:center;transition:opacity .2s}
.layer b{font-family:var(--display);font-size:1.1rem}
.layer span{display:block;font-size:.95rem;line-height:1.3}
.layer.dim{opacity:.35}
.l-oven{background:#f4a24a}.l-toppings{background:#7fd1a8}.l-kaas{background:#ffd75e}.l-saus{background:#f08a78}.l-bodem{background:#e8c58a}
ul,ol{padding-left:1.3em;margin:0 0 .8em} li{margin-bottom:.35em}
.checkrow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;justify-content:flex-start;min-height:56px;padding:10px 16px;margin-bottom:8px;font-family:var(--body);font-weight:700;font-size:1.05rem;line-height:1.35}

<script>
(function(){
"use strict";
var KEY="ai-avontuur-v1";

/* ---------- state ---------- */
function defaults(){return {name:"",rules:false,done:{},drafts:{},manual:{},log:[],ans:{},checks:{}};}
var S=load();
var PK="ai-profiel-v1";
(function(){try{var p=JSON.parse(localStorage.getItem(PK)||"{}");if(!S.name&&p.name){S.name=p.name;S.rules=true;save();}}catch(e){}})();
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);var d=defaults();for(var k in d){if(o[k]!==undefined)d[k]=o[k];}return d;}}catch(e){}return defaults();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- content ---------- */
var LAYERS={
 bodem:{n:"Bodem",d:"De opdracht",q:"Wat moet ChatGPT doen?",hint:"Zeg wat ChatGPT moet doen, bijvoorbeeld bedenk, schrijf of leg uit."},
 saus:{n:"Saus",d:"De context",q:"Wie ben ik, voor wie is het en waarom?",hint:"Vertel wie je bent en waarvoor het is, bijvoorbeeld: Ik ben 10 en maak dit voor mijn klas."},
 kaas:{n:"Kaas",d:"Een voorbeeld",q:"Hoe moet het ongeveer worden?",hint:"Geef een voorbeeld met het woord zoals of bijvoorbeeld."},
 toppings:{n:"Toppings",d:"De regels",q:"Hoeveel, hoe lang, welke toon, wat niet?",hint:"Voeg regels toe: hoeveel, hoe lang, hoe grappig of wat niet."},
 oven:{n:"Oven",d:"Verbeteren",q:"Wat vind ik nog niet goed? Vraag door.",hint:""}
};
var RULES=[
 ["Geen geheimen delen","Typ nooit je achternaam, adres, school, telefoonnummer of foto's van mensen."],
 ["AI kan fout zitten","Check belangrijke dingen op een tweede plek, zoals in een boek of bij een volwassene."],
 ["Eerst zelf denken","Bedenk eerst wat jij zelf denkt en vraag het dan pas."],
 ["Eerlijk blijven","Lever nooit werk van ChatGPT in alsof je het zelf gemaakt hebt."],
 ["Vriendelijk blijven","Maak geen gemene of verzonnen verhalen of plaatjes over echte mensen."],
 ["Raar of eng antwoord?","Stop en haal meteen een volwassene. Dat is slim, niet stout."]
];

var LESSONS=[
{id:1,title:"Wat is AI?",sub:"Maak kennis met je slimme maatje",steps:[
 {t:"text",h:"Een computer die heel veel gelezen heeft",p:[
  "AI betekent kunstmatige intelligentie. ChatGPT is een AI die miljoenen teksten heeft gelezen.",
  "Hij raadt steeds welk woord er het best past na het vorige woord. Zo schrijft hij zinnen, verhalen en antwoorden.",

 {t:"quiz",id:"q1",q:"Wat doet ChatGPT eigenlijk?",opts:["Hij raadt welk woord er waarschijnlijk hierna past","Hij zoekt alles op in één groot boek","Hij denkt precies zoals een mens"],ok:0,why:"Hij heeft heel veel teksten gelezen en raadt daardoor goed wat er hierna komt. Soms raadt hij ook mis."},
 {t:"quiz",id:"q2",q:"Kan ChatGPT weten wat jij in je hoofd denkt?",opts:["Ja, hij leest je gedachten","Nee, hij kent alleen de woorden die jij typt"],ok:1,why:"Daarom moet je goed opschrijven wat je wilt. Dat leer je in deze cursus."},
 {t:"prompt",id:"p1",title:"Je eerste prompt",task:"Een prompt is wat jij aan ChatGPT typt. Bedenk iets wat je altijd al wilde weten, bijvoorbeeld over je lievelingsdier of je hobby. Schrijf je vraag hier, kopieer hem en stel hem aan ChatGPT.",need:[],min:10},
 {t:"reflect",id:"r1",q:"Was het antwoord precies wat je wilde?",choices:["Ja, helemaal","Bijna","Nee, niet echt"],ask:"Wat was goed en wat kon beter?"},
 {t:"offline",id:"o1",title:"Mens of AI?",text:"Schrijf met je ouder, broer of zus 3 zinnen over jouw dag. Vraag aan ChatGPT om ook 3 zinnen te schrijven over de dag van een kind van jouw leeftijd. Laat iemand raden welke tekst van de AI is. Waaraan herkende hij of zij het?"}
]},
{id:2,title:"Bodem en saus",sub:"Duidelijk vragen",steps:[
 {t:"text",h:"Wat jij niet zegt, raadt de AI",p:[
  "Stel dat je aan iemand vraagt: Maak een boterham. Smeert hij pindakaas of jam? Snijdt hij hem door? Hij weet het niet. ChatGPT is net zo.",
  "Een goede prompt is als een pizza met lagen. Vandaag leer je de eerste twee: de bodem en de saus."],layers:["bodem","saus"],
  tip:"Begin een gesprek eens met: Ik ben een kind van 10. Praat simpel en vriendelijk."},
 {t:"offline",id:"o2",title:"Domme robot",text:"Jij bent de baas en je ouder is de domme robot die alles letterlijk doet. Geef instructies om een boterham met pindakaas te maken. De robot doet alleen wat je zegt. Wat ging er mis? Wat moet je de volgende keer erbij zeggen?"},
 {t:"quiz",id:"q1",q:"Welke prompt heeft een saus (context)?",opts:["Schrijf een verhaal.","Ik ben 10 en zit in groep 7. Schrijf een kort verhaal voor mijn klas.","Verhaal!"],ok:1,why:"De tweede prompt vertelt wie je bent en voor wie het is. Dat is de saus."},
 {t:"prompt",id:"p1",title:"Verbeter de prompt",bad:"Vertel iets over paarden.",task:"Maak hier een goede prompt van met een bodem (wat moet ChatGPT doen?) en een saus (wie ben jij en waarvoor is het?).",need:["bodem","saus"],min:30},
 {t:"prompt",id:"p2",title:"Verhaal over jouw held",task:"Laat ChatGPT een verhaal schrijven over een held die je zelf bedenkt. Zeg hoe de held heet, waar het gebeurt en wie het gaat lezen.",need:["bodem","saus"],min:50},
 {t:"reflect",id:"r1",q:"Wat gebeurde er toen je meer vertelde?",choices:["Het antwoord werd beter","Het antwoord werd anders","Er veranderde weinig"],ask:"Welk stukje van je prompt had het meeste effect?"}
]},
{id:3,title:"Kaas en toppings",sub:"Voorbeelden en regels",steps:[

 {t:"quiz",id:"q2",q:"Welke zin is een voorbeeld (kaas)?",opts:["Zoals: Welke dino at alleen planten?","Maak 5 vragen.","Voor mijn klas."],ok:0,why:"Een voorbeeld laat zien hoe een vraag eruit mag zien."},
 {t:"prompt",id:"p1",title:"Versie 1: kort",task:"Laat ChatGPT een rap of gedichtje maken over je lievelingsdier, maar vraag het heel kort. Je zet er niets bij.",start:"Schrijf een rap over ",need:["bodem"],min:15},
 {t:"prompt",id:"p2",title:"Versie 2: met voorbeeld",task:"Dezelfde opdracht, maar nu met een voorbeeld van hoe het mag klinken. Gebruik bijvoorbeeld het woord zoals.",start:"Schrijf een rap over ",need:["bodem","kaas"],min:40},
 {t:"prompt",id:"p3",title:"Versie 3: met regels",task:"Dezelfde opdracht, maar nu met regels: hoeveel regels, hoe grappig, wat moet erin en wat niet?",start:"Schrijf een rap over ",need:["bodem","toppings"],min:40},
 {t:"reflect",id:"r1",q:"Welke versie was het best?",choices:["Versie 1","Versie 2","Versie 3"],ask:"Welke laag maakte het grootste verschil, de kaas of de toppings?"}
]},
{id:4,title:"De oven",sub:"Doorvragen en verbeteren",steps:[
 {t:"text",h:"Het eerste antwoord is een begin",p:[
  "Goede prompters stoppen niet na één antwoord. Ze vragen door tot het goed is. Dat is de oven: je bakt het net zo lang tot het lekker is.",
  "Zinnen die je kunt gebruiken:"],list:["Maak het korter.","Maak het grappiger.","Leg het uit alsof ik 8 ben.","Geef me 3 andere versies.","Wat kan er beter aan je eigen antwoord?"],layers:["oven"]},
 {t:"quiz",id:"q1",q:"Het antwoord is te moeilijk. Wat zeg je?",opts:["Leg het uit alsof ik 8 ben.","Niks, zo is het nu eenmaal.","Je bent slecht."],ok:0,why:"Je geeft ChatGPT een duidelijke opdracht om het te verbeteren."},
 {t:"prompt",id:"p1",title:"Start van het duel",task:"Laat ChatGPT een reclametekst maken voor een ijsje dat je zelf bedenkt: een naam, een slogan en een smaak. Gebruik bodem en saus.",need:["bodem","saus"],min:50},
 {t:"prompt",id:"p2",title:"Ronde 1: verbeter",task:"Lees het antwoord. Wat kan beter? Schrijf je vervolgvraag, bijvoorbeeld: Maak de slogan korter.",need:[],min:15},
 {t:"prompt",id:"p3",title:"Ronde 2: verbeter nog een keer",task:"Doe het nog een keer. Kies iets anders om te verbeteren, bijvoorbeeld de naam of de smaak.",need:[],min:15},
 {t:"prompt",id:"p4",title:"Ronde 3: laat ChatGPT zelf nadenken",task:"Vraag ChatGPT wat er nog beter kan aan de reclametekst.",start:"Wat kan er nog beter aan jouw reclametekst? Geef 3 tips.",need:[],min:15},
 {t:"offline",id:"o1",title:"Prompt-duel",text:"Speel met je broer, zus of ouder. Jullie krijgen dezelfde opdracht (bijvoorbeeld: een reclame voor een nieuw ijsje). Jullie doen er drie rondes over en laten de ander kiezen welke versie het meest verbeterd is. Dus niet wie de mooiste had, maar wie het meest verbeterde."}
]},

  "Daarom check je belangrijke dingen. Je kunt dit aan ChatGPT vragen:"],list:["Hoe zeker ben je hiervan?","Waar kan ik dit controleren?","Weet je dit zeker, of raad je?"]},
 {t:"quiz",id:"q1",q:"ChatGPT zegt iets heel zeker. Is het dan waar?",opts:["Altijd","Niet altijd, ik moet het checken","Alleen als het antwoord lang is"],ok:1,why:"Een zeker toontje zegt niets over of het klopt."},
 {t:"prompt",id:"p1",title:"Vraag over iets wat jij goed weet",task:"Kies iets waar jij echt veel van weet, zoals je huisdier, je lievelingsspel of je hobby. Stel er een vraag over aan ChatGPT.",need:[],min:15},
 {t:"reflect",id:"r1",q:"Zat er een fout in het antwoord?",choices:["Ja, ik vond een fout","Nee, alles klopte","Ik weet het niet zeker"],ask:"Wat heb je gecontroleerd en waarmee?"},
 {t:"prompt",id:"p2",title:"Vraag naar zekerheid",task:"Stel nu de controle-vraag aan ChatGPT. Pas hem aan als je wilt.",start:"Hoe zeker ben je van je laatste antwoord? Waar kan ik dit controleren?",need:[],min:15},
 {t:"offline",id:"o1",title:"Vind de fout",text:"Zoek samen met je ouder één feit uit een ChatGPT-antwoord dat je kunt nakijken in een boek, op een betrouwbare website of bij iemand die er verstand van heeft. Klopte het?"}
]},
{id:6,title:"ChatGPT als leercoach",sub:"Leren, niet laten doen",steps:[
 {t:"text",h:"Laat ChatGPT je helpen leren",p:[
  "ChatGPT kan iets uitleggen op jouw niveau, oefenvragen maken en blijven doorvragen. Zo leer je meer dan wanneer hij het werk voor je doet.",
  "De krachtigste truc is terugvragen: zeg dat ChatGPT eerst vragen aan jou moet stellen voordat hij begint."],tip:"Leer het ook echt: leg daarna zelf in je eigen woorden uit wat je geleerd hebt."},
 {t:"quiz",id:"q1",q:"Wat is eerlijk?",opts:["ChatGPT mijn huiswerk laten maken en inleveren","ChatGPT iets laten uitleggen en mij vragen laten stellen om te oefenen","Een werkstuk door ChatGPT laten schrijven en mijn naam erop zetten"],ok:1,why:"Uitleg en oefenen helpen je leren. Inleveren wat een ander (of een AI) maakte is niet eerlijk."},
 {t:"prompt",id:"p1",title:"Uitleg en oefenvragen",task:"Vervang [onderwerp] door iets wat je op school leert, bijvoorbeeld breuken of de Romeinen.",start:"Leg [onderwerp] uit alsof ik 10 ben. Stel me daarna 5 vragen, één voor één, en wacht op mijn antwoord.",need:["bodem","saus","toppings"],min:40,forbid:["[","]"],forbidMsg:"Vervang eerst [onderwerp] door een echt onderwerp."},
 {t:"prompt",id:"p2",title:"Eerst vragen aan mij",task:"Vervang [onderwerp] door iets wat je wilt leren of waar je een spreekbeurt over wilt houden.",start:"Ik wil iets leren over [onderwerp]. Stel me eerst 3 vragen voordat je begint, zodat je weet wat ik al weet.",need:["bodem","toppings"],min:40,forbid:["[","]"],forbidMsg:"Vervang eerst [onderwerp] door een echt onderwerp."},
 {t:"offline",id:"o1",title:"Leg het terug uit",text:"Leg aan een ouder, broer of zus in je eigen woorden uit wat je net hebt geleerd. Lukt het zonder te kijken? Dan snap je het echt."}
]},
{id:7,title:"Maker worden",sub:"Jij bedenkt, jij beslist",steps:[
 {t:"text",h:"Van idee naar ding",p:[
  "Nu gebruik je alle lagen samen. Jij bedenkt het, ChatGPT helpt, en jij beslist wat er in komt. Kies een eindproject. Je mag later een ander kiezen."]},
 {t:"choose",id:"c1",q:"Wat ga je maken?",opts:["Een quiz of puzzel over mijn hobby","Een eigen verhaal of stripboek","Een bordspel of kaartspel","Een uitvinding met plan en uitleg","Een kookboekje of krant voor de familie"]},
 {t:"prompt",id:"p1",title:"Je plan met alle lagen",task:"Vul in tussen de haken en maak er jouw plan van. Gebruik bodem, saus, kaas én toppings.",start:"Ik ben [naam] en ik ben [leeftijd]. Maak [wat] over [onderwerp] voor [wie]. Bijvoorbeeld zoals [voorbeeld]. Maak het [regels].",need:["bodem","saus","kaas","toppings"],min:60,forbid:["[","]"],forbidMsg:"Vervang alles tussen [ ] door je eigen woorden."},
 {t:"prompt",id:"p2",title:"Verbeter je eerste versie",task:"Kijk naar het resultaat. Wat wil je anders? Schrijf je vervolgvraag.",need:[],min:20},
 {t:"check",id:"k1",title:"Mijn controle",items:["Ik heb gecontroleerd of het klopt.","Het idee is van mij, ChatGPT hielp alleen.","Ik heb minstens één keer verbeterd.","Ik wil het aan de familie laten zien."]}
]},
{id:8,title:"Afronden en vooruitkijken",sub:"Wat kan AI wel en niet?",steps:[
 {t:"text",h:"Wat kan ChatGPT niet?",p:["ChatGPT is slim in taal, maar hij is geen mens. Dit kan hij niet:"],list:["Echt voelen hoe jij je voelt.","Jouw dag kennen, tenzij jij het vertelt.","Zeker weten dat iets klopt.","Verantwoordelijk zijn voor wat jij met het antwoord doet. Dat blijf jij."],
  tip:"Er komen veel nieuwe beroepen waarin mensen met AI samenwerken. Wie goed kan vragen, controleren en bedenken, heeft daar het meeste aan."},
 {t:"quiz",id:"q1",q:"Wat kan ChatGPT niet?",opts:["Een verhaal schrijven","Voelen hoe jij je voelt","Een quiz maken"],ok:1,why:"Hij kan teksten maken, maar voelen doet hij niet."},
 {t:"reflect",id:"r1",q:"Waar wil jij AI later voor gebruiken?",choices:[],ask:"Schrijf het op in een of twee zinnen."},
 {t:"reflect",id:"r2",q:"Waar wil je AI juist niet voor gebruiken?",choices:[],ask:"Schrijf het op in een of twee zinnen."},
 {t:"check",id:"k1",title:"Presentatie",items:["Ik heb mijn logboek bekeken.","Ik weet welke prompt het best werkte.","Ik heb mijn project aan de familie laten zien."]}
]}
];

/* ---------- helpers ---------- */
var STEPS={};
LESSONS.forEach(function(L){L.steps.forEach(function(s){if(s.id){STEPS[L.id+"-"+s.id]={L:L,s:s};}});});
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function $(id){return document.getElementById(id);}
var RX={
 bodem:/\b(bedenk|bedenken|schrijf|schrijven|maak|maken|leg|geef|vertel|teken|verzin|help|noem|vergelijk|stel|laat|bouw|plan|ontwerp|kun je|kan je)\b/,
 saus:/\b(ik ben|ik zit|ik heb|ik wil|ik vind|ik ga|alsof ik|mijn|voor mij|voor een|voor de|omdat|zodat)\b/,
 kaas:/(bijvoorbeeld|zoals|voorbeeld|zo'n|zo een|net als|in de stijl)/,
 toppings:/(\d|\bkort|\blang|grappig|spannend|makkelijk|simpel|eenvoudig|woorden|zinnen|regels|\bniet\b|\bgeen\b|maximaal|minimaal|alinea|stappen|rijm)/
};
function detect(t){t=(t||"").toLowerCase();return {bodem:RX.bodem.test(t),saus:RX.saus.test(t),kaas:RX.kaas.test(t),toppings:RX.toppings.test(t)};}
function eff(key,layer,auto){var m=S.manual[key];return (m&&m[layer]!==undefined)?m[layer]:auto[layer];}
function draftOf(key){var e=STEPS[key];if(S.drafts[key]!==undefined)return S.drafts[key];return e.s.start||"";}
function stepDone(key){return !!S.done[key];}
function progress(L){var t=0,d=0;L.steps.forEach(function(s){if(s.id){t++;if(stepDone(L.id+"-"+s.id))d++;}});return {t:t,d:d};}
function lessonFinished(L){var p=progress(L);return p.d===p.t;}
function allFinished(){return LESSONS.every(lessonFinished);}
function pct(L){var p=progress(L);return Math.round(100*p.d/p.t);}

/* ---------- views ---------- */
function layersHTML(hl){
 var order=["oven","toppings","kaas","saus","bodem"];var widths={oven:"56%",toppings:"68%",kaas:"80%",saus:"90%",bodem:"100%"};
 return "<div class=\"layers\" role=\"list\">"+order.map(function(k){
  var L=LAYERS[k];var dim=hl&&hl.indexOf(k)<0?" dim":"";
  return "<div class=\"layer l-"+k+dim+"\" role=\"listitem\" style=\"width:"+widths[k]+"\"><b>"+L.n+": "+L.d+"</b><span>"+L.q+"</span></div>";
 }).join("")+"</div>";
}
function pizzaSVG(){
 var cx=120,cy=120,r=104,out="<svg class=\"pizza\" viewBox=\"0 0 240 240\" role=\"img\" aria-label=\"Pizza met 8 stukken, een per les\">";
 out+="<circle cx=\"120\" cy=\"120\" r=\"112\" fill=\"var(--dough)\"/>";
 LESSONS.forEach(function(L,i){
  var a0=(i*45-90)*Math.PI/180,a1=((i+1)*45-90)*Math.PI/180,am=(a0+a1)/2;
  var x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
  var fin=lessonFinished(L);
  var tx=cx+66*Math.cos(am),ty=cy+66*Math.sin(am)+7;
  out+="<a href=\"#les-"+L.id+"\" aria-label=\"Les "+L.id+": "+L.title+(fin?" (klaar)":"")+"\">";
  out+="<path d=\"M"+cx+" "+cy+" L"+x0.toFixed(1)+" "+y0.toFixed(1)+" A"+r+" "+r+" 0 0 1 "+x1.toFixed(1)+" "+y1.toFixed(1)+" Z\" fill=\""+(fin?"var(--tomato)":"var(--dough-soft)")+"\" stroke=\"var(--paper)\" stroke-width=\"4\"/>";
  if(fin){
   [[0.45,-0.12],[0.7,0.1],[0.85,-0.08]].forEach(function(p){var ang=am+p[1];var px=cx+r*p[0]*Math.cos(ang),py=cy+r*p[0]*Math.sin(ang);out+="<circle cx=\""+px.toFixed(1)+"\" cy=\""+py.toFixed(1)+"\" r=\"5\" fill=\"var(--sun)\"/>";});
  }
  out+="<text x=\""+tx.toFixed(1)+"\" y=\""+ty.toFixed(1)+"\" text-anchor=\"middle\" fill=\""+(fin?"var(--on-tomato)":"#1c2340")+"\">"+L.id+"</text></a>";
 });
 return out+"</svg>";
}
function onboarding(){
 return "<section class=\"card\"><h1>Welkom bij het AI-avontuur</h1><p>In 8 lessen leer je wat AI is en hoe je slimme prompts maakt voor ChatGPT. Je maakt dingen, je speelt spelletjes en je wordt Prompt-Meester.</p>"+
 "<h2>Hoe heet je?</h2><input type=\"text\" id=\"nm\" autocomplete=\"off\" maxlength=\"24\" placeholder=\"Jouw voornaam\" aria-label=\"Jouw voornaam\" value=\""+esc(S.name)+"\">"+
 "<h2 style=\"margin-top:24px\">De 6 spelregels</h2>"+rulesHTML()+
 "<p>Gebruik ChatGPT alleen als een volwassene in de buurt is.</p>"+
 "<button class=\"checkrow\" data-act=\"agree\" id=\"agree\" aria-pressed=\"false\"><span class=\"box\"></span><span>Ik heb de spelregels gelezen en beloof ze te volgen.</span></button>"+
 "<p class=\"status\" id=\"obst\" role=\"status\"></p><button class=\"primary\" data-act=\"start\">Aan de slag</button></section>";
}
function rulesHTML(){return "<ol>"+RULES.map(function(r){return "<li><b>"+r[0]+".</b> "+r[1]+"</li>";}).join("")+"</ol>";}
function homeView(){
 var fin=LESSONS.filter(lessonFinished).length;
 var h="<section class=\"card hero\"><div><h1>Hoi "+esc(S.name||"")+"!</h1><p>Elke les maakt een stuk van je pizza af. Zijn alle 8 stukken klaar, dan ben je Prompt-Meester.</p><p><b>"+fin+" van 8 lessen klaar.</b></p>";
 if(allFinished())h+="<a class=\"btn primary\" href=\"#diploma\">Bekijk je diploma</a>";
 else{var next=LESSONS.filter(function(L){return !lessonFinished(L);})[0];h+="<a class=\"btn primary\" href=\"#les-"+next.id+"\">"+(fin?"Ga verder met les "+next.id:"Start les 1")+"</a>";}
 h+="</div><div>"+pizzaSVG()+"</div></section>";
 h+="<section class=\"card\"><h2>De Prompt-Pizza</h2><p>Een goede prompt heeft lagen, net als een pizza. Je leert ze een voor een.</p>"+layersHTML()+"</section>";
 h+="<h2>Alle lessen</h2><ul class=\"lessons\">"+LESSONS.map(function(L){
  var p=progress(L),f=lessonFinished(L);
  return "<li><a class=\"lesson"+(f?" finished":"")+"\" href=\"#les-"+L.id+"\"><span class=\"num\">"+L.id+"</span><span><b>"+L.title+"</b><small>"+L.sub+"</small><div class=\"bar\" aria-hidden=\"true\"><span style=\"width:"+pct(L)+"%\"></span></div></span><span class=\"go\">"+(f?"Klaar":p.d+"/"+p.t)+"</span></a></li>";
 }).join("")+"</ul>";
 return h;
}
function tagFor(t){return {text:["ontdek","Ontdek"],quiz:["denk","Weet je het?"],prompt:["probeer","Probeer"],offline:["samen","Doe het samen"],reflect:["denk","Denk na"],check:["denk","Check"],choose:["denk","Kies"]}[t];}
function badge(key){return stepDone(key)?"<span class=\"done-badge\">Klaar</span>":"";}
function chipsHTML(key){
 var s=STEPS[key].s;if(!s.need||!s.need.length)return "";
 var auto=detect(draftOf(key));
 return ["bodem","saus","kaas","toppings"].map(function(l){
  var on=eff(key,l,auto),needed=s.need.indexOf(l)>=0;
  return "<button class=\"chip"+(needed?" needed":"")+(on?" on":"")+"\" data-act=\"layer\" data-key=\""+key+"\" data-layer=\""+l+"\" aria-pressed=\""+on+"\">"+(on?"✓ ":"")+LAYERS[l].n+(needed?" (nodig)":"")+"</button>";
 }).join("");
}
function stepHTML(L,s){
 var key=L.id+"-"+s.id,tg=s.t?tagFor(s.t):null,h="";
 if(s.t==="text"){
  h+="<section class=\"card\"><span class=\"tag ontdek\">Ontdek</span><h2>"+s.h+"</h2>"+(s.p||[]).map(function(p){return "<p>"+p+"</p>";}).join("");
  if(s.list)h+="<ul>"+s.list.map(function(i){return "<li>"+i+"</li>";}).join("")+"</ul>";
  if(s.layers)h+=layersHTML(s.layers);
  if(s.tip)h+="<div class=\"tip\"><b>Tip.</b> "+s.tip+"</div>";
  return h+"</section>";
 }
 h+="<section class=\"card\" id=\"s-"+key+"\"><span class=\"tag "+tg[0]+"\">"+tg[1]+"</span>"+badge(key);
 if(s.t==="quiz"){
  h+="<h3>"+s.q+"</h3>"+s.opts.map(function(o,i){
   var cls="opt"+(stepDone(key)&&i===s.ok?" right":"");
   return "<button class=\""+cls+"\" data-act=\"quiz\" data-key=\""+key+"\" data-i=\""+i+"\">"+o+"</button>";
  }).join("")+"<p class=\"fb\" id=\"fb-"+key+"\" role=\"status\">"+(stepDone(key)?"Goed! "+s.why:"")+"</p>";
 }else if(s.t==="prompt"){
  h+="<h3>"+s.title+"</h3>"+(s.bad?"<div class=\"bad\"><b>Slechte prompt:</b> “"+s.bad+"”</div>":"")+"<p>"+s.task+"</p>"+
   "<textarea id=\"ta-"+key+"\" data-key=\""+key+"\" rows=\"5\" placeholder=\"Schrijf hier je prompt\" aria-label=\"Jouw prompt\">"+esc(draftOf(key))+"</textarea>"+
   "<div class=\"chips\" id=\"chips-"+key+"\">"+chipsHTML(key)+"</div>"+
   (s.need&&s.need.length?"<p class=\"hintline\">De robot zoekt de lagen in je tekst, maar hij kan zich vergissen. Tik op een laag om hem zelf aan of uit te zetten.</p>":"")+
   "<div class=\"row\"><button data-act=\"copy\" data-key=\""+key+"\">Kopieer prompt</button><a class=\"btn ghost\" href=\"https://chatgpt.com\" target=\"_blank\" rel=\"noopener\">Open ChatGPT</a><button class=\"primary\" data-act=\"savep\" data-key=\""+key+"\">Bewaar in logboek</button></div>"+
   "<p class=\"status\" id=\"st-"+key+"\" role=\"status\"></p>";
 }else if(s.t==="offline"){
  h+="<h3>"+s.title+"</h3><p>"+s.text+"</p><button class=\"checkrow"+(stepDone(key)?" on":"")+"\" data-act=\"off\" data-key=\""+key+"\" aria-pressed=\""+stepDone(key)+"\"><span class=\"box\">"+(stepDone(key)?"✓":"")+"</span><span>Dit hebben we gedaan</span></button>";
 }else if(s.t==="reflect"){
  var a=S.ans[key]||{c:null,t:""};
  h+="<h3>"+s.q+"</h3>"+(s.choices||[]).map(function(c,i){return "<button class=\"opt"+(a.c===i?" sel":"")+"\" data-act=\"rc\" data-key=\""+key+"\" data-i=\""+i+"\" aria-pressed=\""+(a.c===i)+"\">"+c+"</button>";}).join("")+
   "<p>"+s.ask+"</p><textarea data-rkey=\""+key+"\" rows=\"3\" aria-label=\"Jouw antwoord\">"+esc(a.t||"")+"</textarea>"+
   "<div class=\"row\"><button class=\"primary\" data-act=\"rsave\" data-key=\""+key+"\">Opslaan</button></div><p class=\"status\" id=\"st-"+key+"\" role=\"status\"></p>";
 }else if(s.t==="check"){
  var cs=S.checks[key]||[];
  h+="<h3>"+s.title+"</h3>"+s.items.map(function(it,i){return "<button class=\"checkrow"+(cs[i]?" on":"")+"\" data-act=\"chk\" data-key=\""+key+"\" data-i=\""+i+"\" aria-pressed=\""+!!cs[i]+"\"><span class=\"box\">"+(cs[i]?"✓":"")+"</span><span>"+it+"</span></button>";}).join("");
 }else if(s.t==="choose"){
  var a2=S.ans[key];
  h+="<h3>"+s.q+"</h3>"+s.opts.map(function(o,i){return "<button class=\"opt"+(a2===i?" sel":"")+"\" data-act=\"choose\" data-key=\""+key+"\" data-i=\""+i+"\" aria-pressed=\""+(a2===i)+"\">"+o+"</button>";}).join("");
 }
 return h+"</section>";
}
function lessonView(n){
 var L=LESSONS[n-1];if(!L)return homeView();
 var h="<section class=\"card\"><p style=\"margin:0;color:var(--muted);font-weight:700\">Les "+L.id+" van 8</p><h1>"+L.title+"</h1><p>"+L.sub+"</p><div class=\"bar\" aria-hidden=\"true\"><span style=\"width:"+pct(L)+"%\"></span></div><p class=\"hintline\">"+progress(L).d+" van "+progress(L).t+" opdrachten klaar</p></section>";
 h+=L.steps.map(function(s){return stepHTML(L,s);}).join("");
 if(lessonFinished(L))h+="<section class=\"card good\"><h2>Les "+L.id+" is klaar!</h2><p>Er is een stuk van je pizza ingekleurd.</p></section>";
 h+="<div class=\"lessonnav\">"+(n>1?"<a class=\"btn\" href=\"#les-"+(n-1)+"\">Vorige les</a>":"<span></span>")+
   (n<8?"<a class=\"btn primary\" href=\"#les-"+(n+1)+"\">Volgende les</a>":"<a class=\"btn primary\" href=\"#start\">Naar de kaart</a>")+"</div>";
 return h;
}
function logView(){
 var h="<section class=\"card\"><h1>Mijn logboek</h1><p>Hier staan al je bewaarde prompts. Kijk wat het best werkte en gebruik het weer.</p></section>";
 if(!S.log.length)return h+"<section class=\"card\"><p>Je hebt nog geen prompts bewaard. Maak een prompt in een les en tik op Bewaar in logboek.</p></section>";
 var list=S.log.slice().sort(function(a,b){return a.d<b.d?1:-1;});
 return h+"<section class=\"card\">"+list.map(function(e,i){
  return "<div class=\"log\"><b>Les "+e.lesson+": "+esc(e.title)+"</b><pre>"+esc(e.text)+"</pre><button class=\"small\" data-act=\"copylog\" data-key=\""+esc(e.key)+"\">Kopieer</button></div>";
 }).join("")+"<p class=\"status\" id=\"logst\" role=\"status\"></p></section>";
}
function rulesView(){return "<section class=\"card\"><h1>De 6 spelregels</h1>"+rulesHTML()+"<p>Gebruik ChatGPT alleen als een volwassene in de buurt is.</p></section>";}
function parentsView(){
 return "<section class=\"card\"><h1>Voor ouders</h1>"+
 "<h3>Zo werkt het</h3><p>De cursus heeft 8 lessen van 45 tot 60 minuten. Elke les heeft uitleg, vragen, een of meer prompt-oefeningen voor ChatGPT en een spel om samen te doen. De kinderen schrijven hun prompt hier, kopiëren hem en plakken hem in ChatGPT. Daarna komen ze terug om te reflecteren.</p>"+
 "<h3>De pizza-robot</h3><p>Onder elke prompt zoekt een eenvoudig programma naar de lagen (bodem, saus, kaas, toppings). Het kijkt alleen naar bepaalde woorden en kan zich vergissen. Het kind kan elke laag zelf aan of uit zetten. Het gaat om het nadenken, niet om het scoren.</p>"+
 "<h3>ChatGPT en leeftijd</h3><p>ChatGPT stelt in de voorwaarden een minimumleeftijd. Lees de actuele voorwaarden van OpenAI, kijk in de instellingen van de app naar opties voor ouderlijk toezicht en naar de instelling voor het gebruik van gesprekken om het model te verbeteren, en zit er de eerste weken bij. Hoe jullie hiermee omgaan is jouw keuze.</p>"+
 "<h3>Voortgang</h3><p>Voortgang en logboek staan alleen op dit apparaat, in deze browser. Wis je de browsergegevens, dan zijn ze weg.</p>"+
 "<div id=\"resetbox\"><button data-act=\"reset1\">Voortgang wissen</button></div></section>";
}
function diplomaView(){
 if(!allFinished())return "<section class=\"card\"><h2>Nog niet klaar</h2><p>Maak eerst alle 8 lessen af.</p><a class=\"btn primary\" href=\"#start\">Naar de kaart</a></section>";
 var d=new Date().toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"});
 return "<section class=\"diploma\"><p style=\"font-weight:700;color:var(--muted)\">Dit diploma is voor</p><h1>"+esc(S.name)+"</h1><h2>Prompt-Meester</h2>"+
 "<p>Je kunt een prompt bouwen met bodem, saus, kaas en toppings, doorvragen tot het goed is, controleren of het klopt en met ChatGPT iets maken dat van jou is.</p>"+
 "<p><b>"+d+"</b></p><p style=\"color:var(--muted)\">Maak een schermafbeelding om dit diploma te bewaren.</p></section>"+
 "<div class=\"row\" style=\"justify-content:center\"><a class=\"btn\" href=\"#start\">Naar de kaart</a></div>";
}

/* ---------- render ---------- */
var lastRoute=null;
function route(){return (location.hash||"").replace("#","")||"start";}
function render(keep){
 var r=route(),app=$("app"),y=window.scrollY;
 if(!S.rules&&r!=="ouders"&&r!=="spelregels"){app.innerHTML=onboarding();document.title="AI-avontuur";lastRoute=r;return;}
 var m=/^les-(\d+)$/.exec(r);
 if(m)app.innerHTML=lessonView(parseInt(m[1],10));
 else if(r==="logboek")app.innerHTML=logView();
 else if(r==="spelregels")app.innerHTML=rulesView();
 else if(r==="ouders")app.innerHTML=parentsView();
 else if(r==="diploma")app.innerHTML=diplomaView();
 else app.innerHTML=homeView();
 if(keep||lastRoute===r)window.scrollTo(0,y);else window.scrollTo(0,0);
 lastRoute=r;
}
window.addEventListener("hashchange",function(){render(false);});

/* ---------- actions ---------- */
function say(id,msg){var e=$(id);if(e)e.textContent=msg;}
function updateChips(key){var c=$("chips-"+key);if(c)c.innerHTML=chipsHTML(key);}
document.addEventListener("input",function(e){
 var t=e.target;
 if(t.matches&&t.matches("textarea[data-key]")){var key=t.getAttribute("data-key");S.drafts[key]=t.value;save();updateChips(key);}
 else if(t.matches&&t.matches("textarea[data-rkey]")){var k=t.getAttribute("data-rkey");var a=S.ans[k]||{c:null,t:""};a.t=t.value;S.ans[k]=a;save();}
});
function copyFrom(text,ta,stId){
 var done=function(){say(stId,"Gekopieerd! Plak hem nu in ChatGPT.");};
 var fail=function(){if(ta){ta.focus();ta.setSelectionRange(0,99999);}say(stId,"Tik op de geselecteerde tekst en kies Kopieer.");};
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fail);}else{fail();}}catch(err){fail();}
}
document.addEventListener("click",function(e){
 var b=e.target.closest?e.target.closest("[data-act]"):null;if(!b)return;
 var act=b.getAttribute("data-act"),key=b.getAttribute("data-key"),i=parseInt(b.getAttribute("data-i"),10);
 if(act==="agree"){var on=b.classList.toggle("on");b.setAttribute("aria-pressed",on);b.querySelector(".box").textContent=on?"✓":"";return;}
 if(act==="start"){
  var nm=($("nm").value||"").trim();var ag=$("agree").classList.contains("on");
  if(!nm){say("obst","Vul eerst je naam in.");return;}
  if(!ag){say("obst","Tik eerst op het vakje om te beloven dat je de spelregels volgt.");return;}
  S.name=nm;S.rules=true;save();try{localStorage.setItem(PK,JSON.stringify({name:nm}));}catch(e){}if(route()!=="start")location.hash="#start";render(false);return;
 }
 if(act==="quiz"){
  var s=STEPS[key].s;var fb=$("fb-"+key);
  if(i===s.ok){S.done[key]=true;save();render(true);}
  else{b.classList.add("wrong");if(fb)fb.textContent="Nog niet. Probeer een ander antwoord.";}
  return;
 }
 if(act==="layer"){
  var l=b.getAttribute("data-layer");var auto=detect(draftOf(key));var cur=eff(key,l,auto);
  S.manual[key]=S.manual[key]||{};S.manual[key][l]=!cur;save();updateChips(key);return;
 }
 if(act==="copy"){var ta=$("ta-"+key);copyFrom(ta.value,ta,"st-"+key);return;}
 if(act==="savep"){
  var e2=STEPS[key],s2=e2.s,ta2=$("ta-"+key),text=ta2.value.trim(),au=detect(text);
  if(text.length<(s2.min||10)){say("st-"+key,"Schrijf nog wat meer. Een goede prompt is meestal een of twee zinnen.");return;}
  if(s2.forbid&&s2.forbid.some(function(f){return text.indexOf(f)>=0;})){say("st-"+key,s2.forbidMsg);return;}
  var miss=(s2.need||[]).filter(function(l2){return !eff(key,l2,au);});
  if(miss.length){say("st-"+key,"Nog niet klaar. Er mist nog: "+miss.map(function(l3){return LAYERS[l3].n.toLowerCase()+". "+LAYERS[l3].hint;}).join(" "));return;}
  S.drafts[key]=text;S.done[key]=true;
  var entry={key:key,lesson:e2.L.id,title:s2.title,text:text,d:new Date().toISOString()};
  var found=false;S.log=S.log.map(function(x){if(x.key===key){found=true;return entry;}return x;});if(!found)S.log.push(entry);
  save();render(true);return;
 }
 if(act==="off"){if(S.done[key])delete S.done[key];else S.done[key]=true;save();render(true);return;}
 if(act==="rc"){var a=S.ans[key]||{c:null,t:""};a.c=i;S.ans[key]=a;save();render(true);return;}
 if(act==="rsave"){
  var s3=STEPS[key].s,a3=S.ans[key]||{c:null,t:""},ta3=document.querySelector("textarea[data-rkey=\""+key+"\"]");if(ta3)a3.t=ta3.value;
  if(s3.choices&&s3.choices.length){if(a3.c===null){say("st-"+key,"Kies eerst een antwoord.");return;}}
  else if((a3.t||"").trim().length<5){say("st-"+key,"Schrijf nog wat meer op.");return;}
  S.ans[key]=a3;S.done[key]=true;save();render(true);return;
 }
 if(act==="chk"){
  var arr=S.checks[key]||[];arr[i]=!arr[i];S.checks[key]=arr;
  var n=STEPS[key].s.items.length,all=true;for(var q=0;q<n;q++){if(!arr[q])all=false;}
  if(all)S.done[key]=true;else delete S.done[key];save();render(true);return;
 }
 if(act==="choose"){S.ans[key]=i;S.done[key]=true;save();render(true);return;}
 if(act==="copylog"){
  var ent=S.log.filter(function(x){return x.key===key;})[0];if(ent)copyFrom(ent.text,null,"logst");return;
 }
 if(act==="reset1"){$("resetbox").innerHTML="<p><b>Weet je zeker dat je alles wilt wissen?</b> Dit kan niet ongedaan worden gemaakt.</p><button class=\"primary\" data-act=\"reset2\">Ja, alles wissen</button> <button data-act=\"reset0\">Nee, terug</button>";return;}
 if(act==="reset0"){$("resetbox").innerHTML="<button data-act=\"reset1\">Voortgang wissen</button>";return;}
 if(act==="reset2"){S=defaults();save();try{localStorage.removeItem(PK);}catch(e){}location.hash="#start";render(false);return;}
});
render(false);
})();
</script>
</body>
</html>
