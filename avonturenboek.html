<meta name="apple-mobile-web-app-title" content="Avonturenboek">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Plan: avonturenboek voor 9-11 jaar. Inktblauw, teal, zon-geel, groen, zand.
   Layout: een brede kolom, grote tikvlakken voor iPad, een pizza als voortgangskaart. */
:root{
  --ink:#1c2340; --paper:#f1f4ff; --card:#ffffff; --line:#d9deef; --soft:#e9edfb; --muted:#566086;
  --tomato:#0f7a6d; --on-tomato:#ffffff; --sun:#ffc531; --basil:#17835a; --on-basil:#ffffff;
  --dough:#e8c58a; --dough-soft:#f3e3c1; --blue:#2a62ff; --bad:#fdeceb; --good:#e3f6ec;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eef0ff; --paper:#121629; --card:#1c2240; --line:#323a63; --soft:#262d52; --muted:#aab2d8;
    --tomato:#3ccdb8; --on-tomato:#06231f; --basil:#3cc593; --on-basil:#0b2a1f;
    --dough-soft:#3a3550; --blue:#8aa8ff; --bad:#3b2230; --good:#17332b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#eef0ff; --paper:#121629; --card:#1c2240; --line:#323a63; --soft:#262d52; --muted:#aab2d8;
  --tomato:#3ccdb8; --on-tomato:#06231f; --basil:#3cc593; --on-basil:#0b2a1f;
  --dough-soft:#3a3550; --blue:#8aa8ff; --bad:#3b2230; --good:#17332b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding:16px 16px calc(72px + env(safe-area-inset-bottom));padding-top:calc(16px + env(safe-area-inset-top))}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0 0 .5em;text-wrap:balance}
h1{font-size:2.3rem} h2{font-size:1.55rem} h3{font-size:1.25rem}
p{margin:0 0 .8em}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:var(--display);font-weight:700;font-size:1.4rem;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--sun) 0 22%,var(--tomato) 24% 100%);border:3px solid var(--dough)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn,button{font-family:var(--display);font-weight:600;font-size:1.05rem;min-height:52px;padding:0 20px;border-radius:14px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;touch-action:manipulation}
.btn.small,button.small{min-height:44px;padding:0 14px;font-size:1rem}
.primary{background:var(--tomato);border-color:var(--tomato);color:var(--on-tomato)}
.ghost{background:transparent}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}
.tag{display:inline-block;font-family:var(--display);font-weight:600;font-size:.85rem;padding:2px 12px;border-radius:99px;margin-bottom:10px;background:var(--soft);color:var(--ink)}
.tag.probeer{background:var(--sun);color:#1c2340}
.tag.ontdek{background:var(--blue);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.ontdek{color:#10163a}}
:root[data-theme="dark"] .tag.ontdek{color:#10163a}
.tag.samen{background:var(--basil);color:var(--on-basil)}
.tag.denk{background:var(--dough);color:#1c2340}
.done-badge{float:right;font-family:var(--display);font-weight:600;background:var(--basil);color:var(--on-basil);border-radius:99px;padding:2px 14px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
textarea,input[type=text]{width:100%;font-family:var(--body);font-size:18px;line-height:1.5;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{resize:vertical;min-height:120px}
.bad,.good{border-radius:14px;padding:10px 14px;margin:0 0 12px}
.bad{background:var(--bad)} .good{background:var(--good)}
.tip{background:var(--soft);border-left:6px solid var(--sun);border-radius:12px;padding:10px 14px;margin-top:12px}
.status{min-height:1.5em;margin:10px 0 0;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{min-height:44px;padding:0 16px;font-size:1rem;border-radius:99px;border-style:dashed;border-color:var(--muted);color:var(--muted);background:transparent}
.chip.needed{border-style:solid;border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--basil);border-color:var(--basil);color:var(--on-basil);border-style:solid}
.hintline{font-size:.95rem;color:var(--muted);margin:8px 0 0}

select{font-family:var(--body);font-size:18px;min-height:52px;border:2px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:0 10px;width:100%}

<script>
(function(){
"use strict";
var KEY="avonturenboek-v1";

/* ---------- state ---------- */
function newStory(){return {title:"",theme:"bos",themeSet:false,scenes:[{text:"",choices:[]}]};}
function defaults(){return {name:"",rules:false,done:{},drafts:{},manual:{},log:[],ans:{},checks:{},story:newStory()};}
var S=load();
var PK="ai-profiel-v1";
(function(){try{var p=JSON.parse(localStorage.getItem(PK)||"{}");if(!S.name&&p.name){S.name=p.name;S.rules=true;save();}}catch(e){}})();
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);var d=defaults();for(var k in d){if(o[k]!==undefined)d[k]=o[k];}if(!d.story||!d.story.scenes||!d.story.scenes.length)d.story=newStory();return d;}}catch(e){}return defaults();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- content ---------- */
var LAYERS={
 bodem:{n:"Bodem",d:"De opdracht",q:"Wat moet ChatGPT doen?",hint:"Zeg wat ChatGPT moet doen, bijvoorbeeld bedenk, schrijf of maak."},
 saus:{n:"Saus",d:"De context",q:"Wie ben ik, voor wie is het en waarom?",hint:"Vertel wie je bent en waarvoor het is, bijvoorbeeld: Ik ben 10 en maak een avontuur."},
 kaas:{n:"Kaas",d:"Een voorbeeld",q:"Hoe moet het ongeveer worden?",hint:"Geef een voorbeeld met het woord zoals of bijvoorbeeld."},
 toppings:{n:"Toppings",d:"De regels",q:"Hoeveel, hoe lang, welke toon, wat niet?",hint:"Voeg regels toe: hoeveel zinnen, hoe spannend of wat niet."}
};
var THEMES={bos:["Bos","#1f4d3a","#f2ffe9"],ruimte:["Ruimte","#14143a","#e8e8ff"],zee:["Zee","#0c3b5c","#e6f6ff"],kasteel:["Kasteel","#4a3a2a","#fff4e0"]};
var RULES=[
 ["Geen geheimen delen","Typ nooit je achternaam, adres, school, telefoonnummer of foto's van mensen. Zet ze ook niet in je verhaal."],
 ["AI kan fout zitten","Check belangrijke dingen op een tweede plek, zoals in een boek of bij een volwassene."],
 ["Eerst zelf denken","Bedenk eerst wat jij zelf denkt en vraag het dan pas."],
 ["Eerlijk blijven","Zeg erbij als ChatGPT een deel van je verhaal heeft geholpen. Het idee en de keuzes zijn van jou."],
 ["Vriendelijk blijven","Maak geen gemene of verzonnen verhalen over echte mensen."],
 ["Raar of eng antwoord?","Stop en haal meteen een volwassene. Dat is slim, niet stout."]
];

var LESSONS=[
{id:1,title:"Een avontuur bedenken",sub:"Held, plek, probleem en doel",steps:[
 {t:"text",h:"Elk goed avontuur heeft vier dingen",p:["Een held (wie?), een plek (waar?), een probleem (wat gaat mis?) en een doel (wat wil de held?).","In dit avontuur beslist de lezer zelf hoe het verder gaat. Dat heet een verhaal met keuzes."]},
 {t:"quiz",id:"q1",q:"Wat is een probleem in een avontuur?",opts:["De held heet Sam.","De brug naar het kasteel is kapot.","Het verhaal speelt in een bos."],ok:1,why:"Een probleem is iets wat de held moet oplossen. Zonder probleem is er geen spanning."},
 {t:"offline",id:"o1",title:"Wat als...?",text:"Speel dit in de auto of aan tafel. Een van jullie begint met Wat als...? bijvoorbeeld: Wat als de kat kan praten? De ander maakt het verhaal verder in één zin. Doe minstens tien beurten."},
 {t:"prompt",id:"p1",title:"Ideeën laten bedenken",task:"Laat ChatGPT drie ideeën bedenken voor een avontuur waarin de lezer keuzes maakt. Gebruik bodem, saus en toppings uit de Prompt-Pizza.",need:["bodem","saus","toppings"],min:50},
 {t:"form",id:"f1",title:"Mijn avontuur in vier regels",task:"Kies een idee van ChatGPT, of maak er zelf een van. Vul de vier dingen in.",fields:[{l:"Held",ph:"Wie is het?"},{l:"Plek",ph:"Waar gebeurt het?"},{l:"Probleem",ph:"Wat gaat er mis?"},{l:"Doel",ph:"Wat wil de held bereiken?"}]},
 {t:"reflect",id:"r1",q:"Wat heb je zelf veranderd aan het idee van ChatGPT?",choices:[],ask:"Schrijf in een of twee zinnen wat jij hebt aangepast of bedacht."}
]},
{id:2,title:"Scènes en keuzes",sub:"Je verhaal als een boom",steps:[
 {t:"text",h:"Een scène eindigt met een keuze",p:["Een scène is een stukje verhaal. Aan het eind kiest de lezer.","Bijvoorbeeld: Je staat voor een donkere grot. Ga je naar binnen, of klim je de berg op? Elke keuze leidt naar een nieuwe scène. Sommige paden stoppen. Dat zijn eindscènes."],tip:"Een goede keuze heeft twee antwoorden die allebei spannend zijn. Een keuze met een duidelijk beste antwoord is saai."},
 {t:"quiz",id:"q1",q:"Welke keuze is het best?",opts:["Ga je door of niet?","Ga je de donkere grot in, of klim je de berg op?","Wil je winnen?"],ok:1,why:"Beide kanten zijn anders en spannend."},
 {t:"offline",id:"o1",title:"Teken je verhaalboom",text:"Pak een groot vel papier. Teken een rondje voor elke scène en pijlen voor elke keuze. Begin met 5 rondjes. Welke scènes zijn eindscènes?"},
 {t:"storygoal",id:"g1",title:"Je eerste scènes",task:"Open de speeltuin en maak 5 scènes. Schrijf eerst alleen een paar woorden per scène. Verbind ze met minstens 4 keuzes.",minScenes:5,minChoices:4},
 {t:"reflect",id:"r1",q:"Hoe ging het van papier naar de speeltuin?",choices:["Het paste meteen","Ik moest iets veranderen"],ask:"Wat veranderde je aan je verhaalboom?"}
]},
{id:3,title:"Schrijven met ChatGPT",sub:"Jij beslist, ChatGPT helpt",steps:[
 {t:"text",h:"Jij bent de schrijver",p:["ChatGPT kan scènes schrijven. Maar jij beslist wat blijft en wat verandert. Lees het, kies de beste stukken en pas het aan met je eigen woorden.","Je kent de Prompt-Pizza al. Gebruik hem hier weer."],layers:["bodem","saus","kaas","toppings"],tip:"Eerlijk blijven: zeg erbij dat ChatGPT een deel heeft geholpen. Het idee en de keuzes zijn van jou."},
 {t:"quiz",id:"q1",q:"ChatGPT schrijft een scène. Wat doe jij?",opts:["Alles kopiëren, klaar","Lezen, de beste stukken kiezen en aanpassen","Niets, ChatGPT beslist"],ok:1,why:"Jij bent de schrijver. ChatGPT is je hulp."},
 {t:"prompt",id:"p1",title:"Scène 1 schrijven",task:"Vervang alles tussen de haken door je eigen idee.",start:"Ik ben 10 en maak een avontuur waarin de lezer kiest. De held is [naam] en is in [plek]. Schrijf scène 1 in maximaal 6 zinnen, spannend, en eindig met een keuze tussen twee dingen.",need:["bodem","saus","toppings"],min:60,forbid:["[","]"],forbidMsg:"Vervang alles tussen [ ] door je eigen woorden."},
 {t:"prompt",id:"p2",title:"Een volgende scène",task:"Kies een keuze uit je vorige scène en laat ChatGPT de volgende scène schrijven.",start:"Dit gebeurde in de vorige scène: [kort stukje]. De lezer kiest voor [keuze]. Schrijf de volgende scène in maximaal 6 zinnen en eindig met twee keuzes.",need:["bodem","toppings"],min:60,forbid:["[","]"],forbidMsg:"Vervang alles tussen [ ] door je eigen woorden."},
 {t:"storygoal",id:"g1",title:"Schrijf je scènes",task:"Kopieer de stukken die je wilt houden uit ChatGPT en plak ze in de scènes van je speeltuin. Pas ze aan en voeg keuzes toe.",minTextScenes:5,minChoices:4}
]},
{id:4,title:"Sfeer en spanning",sub:"Laat de lezer het voelen",steps:[
 {t:"text",h:"Woorden maken sfeer",p:["Laat de lezer horen, ruiken en voelen. Niet: Het was donker. Maar: Water druppelt van het plafond en de lucht is koud.","Gebruik korte zinnen als het spannend wordt."],list:["Gebruik je zintuigen: zien, horen, ruiken, voelen.","Eindig een scène vlak voor iets spannends.","Maak zinnen korter als het spannend wordt."]},
 {t:"quiz",id:"q1",q:"Welke zin heeft de meeste sfeer?",opts:["Het was een grot.","Water druppelt van het plafond en je hoort iets ademen.","De grot was groot."],ok:1,why:"Je hoort en voelt het mee. Dat maakt sfeer."},
 {t:"prompt",id:"p1",title:"Een scène spannender maken",task:"Plak je eigen scène in plaats van [plak je scène] en vraag ChatGPT om meer sfeer.",start:"Hier is mijn scène: [plak je scène]. Maak hem spannender met geluiden en geuren, maar houd hem onder 6 zinnen.",need:["bodem","toppings"],min:60,forbid:["[","]"],forbidMsg:"Vervang [plak je scène] door je eigen scène."},
 {t:"offline",id:"o1",title:"Teken de sfeer",text:"Teken bij drie scènes een plaatje op papier. Wat zie je, wat hoor je, wat ruik je? Schrijf er een zin bij en gebruik die in je verhaal."},
 {t:"storygoal",id:"g1",title:"Thema en titel",task:"Kies in de speeltuin een thema en een titel. Bouw je avontuur uit tot minstens 7 scènes.",minScenes:7,needTitle:true,needTheme:true}
]},
{id:5,title:"Testen en verbeteren",sub:"Laat een ander spelen",steps:[
 {t:"text",h:"Jij weet hoe het afloopt, de speler niet",p:["Laat iemand anders je avontuur spelen. Kijk waar die persoon twijfelt, lacht of vastloopt. Dat zijn je verbeterpunten.","Zeg tijdens het spelen zelf niets. Dat is moeilijk, maar het werkt."]},
 {t:"offline",id:"o1",title:"Speeltest",text:"Laat iemand uit je gezin je avontuur spelen in de speeltuin. Zeg niets. Schrijf op waar die persoon twijfelde, wat die persoon leuk vond en waar het verwarrend was."},
 {t:"prompt",id:"p1",title:"Feedback vragen aan ChatGPT",task:"Plak een scène en vraag om tips. Jij bepaalt welke tips je gebruikt.",start:"Hier is een scène uit mijn avontuur: [plak je scène]. Wat kan er beter? Geef 3 tips, kort en makkelijk te begrijpen.",need:["bodem","toppings"],min:60,forbid:["[","]"],forbidMsg:"Vervang [plak je scène] door je eigen scène."},
 {t:"storygoal",id:"g1",title:"Elk pad komt ergens uit",task:"Zorg dat je avontuur minstens 2 eindscènes heeft en dat elke scène een stukje verhaal heeft.",minEnds:2,needAllText:true},
 {t:"check",id:"k1",title:"Mijn speeltest",items:["Iemand heeft mijn avontuur gespeeld.","Ik heb gekeken waar die persoon twijfelde of vastliep.","Ik heb minstens twee dingen verbeterd.","Elk pad komt ergens uit."]}
]},
{id:6,title:"Afmaken en presenteren",sub:"Laat zien wat je gemaakt hebt",steps:[
 {t:"text",h:"Maak het af",p:["Lees je avontuur nog een keer helemaal door. Klopt alles? Staan er typfouten in? Past de titel bij het verhaal?","Daarna mag de familie het spelen."]},
 {t:"storygoal",id:"g1",title:"Je eindversie",task:"Maak je avontuur af in de speeltuin.",minScenes:8,minEnds:2,needAllText:true,needTitle:true,needTheme:true},
 {t:"offline",id:"o1",title:"Speel met de familie",text:"Verzamel de familie. Laat ze om de beurt de keuzes maken, of laat ze zelf spelen. Welk pad kiest de meeste mensen? Je kunt je avontuur ook delen via de speeltuin."},
 {t:"reflect",id:"r1",q:"Waar ben je het meest trots op?",choices:[],ask:"Schrijf het op in een of twee zinnen."},
 {t:"reflect",id:"r2",q:"Wat zou je volgende keer anders doen?",choices:[],ask:"Schrijf het op in een of twee zinnen."},
 {t:"check",id:"k1",title:"Afronding",items:["Mijn titel en thema zijn klaar.","Ik heb mijn avontuur laten spelen of gedeeld.","Ik heb in mijn logboek gekeken welke prompts het best werkten."]}
]}
];

/* ---------- helpers ---------- */
var STEPS={};
LESSONS.forEach(function(L){L.steps.forEach(function(s){if(s.id){STEPS[L.id+"-"+s.id]={L:L,s:s};}});});
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function $(id){return document.getElementById(id);}
var RX={
 bodem:/\b(bedenk|bedenken|schrijf|schrijven|maak|maken|leg|geef|vertel|teken|verzin|help|noem|vergelijk|stel|laat|bouw|plan|ontwerp|kun je|kan je)\b/,
 saus:/\b(ik ben|ik zit|ik heb|ik wil|ik vind|ik ga|alsof ik|mijn|voor mij|voor een|voor de|omdat|zodat)\b/,
 kaas:/(bijvoorbeeld|zoals|voorbeeld|zo'n|zo een|net als|in de stijl)/,
 toppings:/(\d|\bkort|\blang|grappig|spannend|makkelijk|simpel|eenvoudig|woorden|zinnen|regels|\bniet\b|\bgeen\b|maximaal|minimaal|alinea|stappen|rijm|onder)/
};
function detect(t){t=(t||"").toLowerCase();return {bodem:RX.bodem.test(t),saus:RX.saus.test(t),kaas:RX.kaas.test(t),toppings:RX.toppings.test(t)};}
function eff(key,layer,auto){var m=S.manual[key];return (m&&m[layer]!==undefined)?m[layer]:auto[layer];}
function draftOf(key){var e=STEPS[key];if(S.drafts[key]!==undefined)return S.drafts[key];return e.s.start||"";}

/* story stats and goals */
function stats(){
 var st=S.story,sc=st.scenes,ts=0,ch=0,ends=0;
 sc.forEach(function(s){
  var has=(s.text||"").trim().length>=20;if(has)ts++;
  var c=(s.choices||[]).filter(function(x){return (x.t||"").trim().length>=2;});
  ch+=c.length;if(has&&c.length===0)ends++;
 });
 return {scenes:sc.length,textScenes:ts,choices:ch,ends:ends,title:(st.title||"").trim().length>=2,theme:!!st.themeSet};
}
function reqs(g){
 var s=stats(),r=[];
 if(g.minScenes)r.push({ok:s.scenes>=g.minScenes,label:"Minstens "+g.minScenes+" scènes (nu "+s.scenes+")"});
 if(g.minTextScenes)r.push({ok:s.textScenes>=g.minTextScenes,label:"In minstens "+g.minTextScenes+" scènes staat een stukje verhaal (nu "+s.textScenes+")"});
 if(g.needAllText)r.push({ok:s.textScenes===s.scenes,label:"Elke scène heeft een stukje verhaal van minstens 20 tekens ("+s.textScenes+" van "+s.scenes+")"});
 if(g.minChoices)r.push({ok:s.choices>=g.minChoices,label:"Minstens "+g.minChoices+" keuzes (nu "+s.choices+")"});
 if(g.minEnds)r.push({ok:s.ends>=g.minEnds,label:"Minstens "+g.minEnds+" eindscènes, dat zijn scènes zonder keuzes (nu "+s.ends+")"});
 if(g.needTitle)r.push({ok:s.title,label:"Je avontuur heeft een titel"});
 if(g.needTheme)r.push({ok:s.theme,label:"Je hebt een thema gekozen"});
 return r;
}
function stepDone(key){var e=STEPS[key];if(e&&e.s.t==="storygoal")return reqs(e.s).every(function(x){return x.ok;});return !!S.done[key];}
function progress(L){var t=0,d=0;L.steps.forEach(function(s){if(s.id){t++;if(stepDone(L.id+"-"+s.id))d++;}});return {t:t,d:d};}
function lessonFinished(L){var p=progress(L);return p.d===p.t;}
function allFinished(){return LESSONS.every(lessonFinished);}
function pct(L){var p=progress(L);return Math.round(100*p.d/p.t);}

/* ---------- views ---------- */
function layersHTML(hl){
 var order=["toppings","kaas","saus","bodem"];var widths={toppings:"68%",kaas:"80%",saus:"90%",bodem:"100%"};
 return "<div class=\"layers\" role=\"list\">"+order.map(function(k){
  var L=LAYERS[k];var dim=hl&&hl.indexOf(k)<0?" dim":"";
  return "<div class=\"layer l-"+k+dim+"\" role=\"listitem\" style=\"width:"+widths[k]+"\"><b>"+L.n+": "+L.d+"</b><span>"+L.q+"</span></div>";
 }).join("")+"</div>";
}
function pathSVG(){

function render(keep){

 var m=/^les-(\d+)$/.exec(r);

 if(m)app.innerHTML=lessonView(parseInt(m[1],10));
 else if(r==="speeltuin")app.innerHTML=storyView();

 else if(t.matches("input[data-fkey]")){var fk=t.getAttribute("data-fkey"),fi=parseInt(t.getAttribute("data-fi"),10);var arr=Array.isArray(S.ans[fk])?S.ans[fk]:[];arr[fi]=t.value;S.ans[fk]=arr;save();}
 else if(t.id==="stt"){S.story.title=t.value;save();}
 else if(t.matches("textarea[data-sc]")){S.story.scenes[parseInt(t.getAttribute("data-sc"),10)].text=t.value;save();}

});
function copyFrom(text,ta,stId,okMsg){
 var done=function(){say(stId,okMsg||"Gekopieerd! Plak hem nu in ChatGPT.");};
 var fail=function(){if(ta){ta.focus();ta.setSelectionRange(0,99999);}say(stId,"Tik op de geselecteerde tekst en kies Kopieer.");};
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fail);}else{fail();}}catch(err){fail();}
}

 sc.forEach(function(s){(s.choices||[]).forEach(function(c){if(c.to===i)c.to=-1;else if(c.to>i)c.to=c.to-1;});});
}
document.addEventListener("click",function(e){
 var b=e.target.closest?e.target.closest("[data-act]"):null;if(!b)return;
 var act=b.getAttribute("data-act"),key=b.getAttribute("data-key"),i=parseInt(b.getAttribute("data-i"),10),j=parseInt(b.getAttribute("data-j"),10);
 if(act==="agree"){var on=b.classList.toggle("on");b.setAttribute("aria-pressed",on);b.querySelector(".box").textContent=on?"✓":"";return;}
 if(act==="start"){
  var nm=($("nm").value||"").trim();var ag=$("agree").classList.contains("on");
  if(!nm){say("obst","Vul eerst je naam in.");return;}
  if(!ag){say("obst","Tik eerst op het vakje om te beloven dat je de spelregels volgt.");return;}
  S.name=nm;S.rules=true;save();try{localStorage.setItem(PK,JSON.stringify({name:nm}));}catch(e){}if(route()!=="start")location.hash="#start";render(false);return;
 }
 if(act==="quiz"){
  var s=STEPS[key].s;var fb=$("fb-"+key);
  if(i===s.ok){S.done[key]=true;save();render(true);}
  else{b.classList.add("wrong");if(fb)fb.textContent="Nog niet. Probeer een ander antwoord.";}
  return;
 }
 if(act==="layer"){
  var l=b.getAttribute("data-layer");var auto=detect(draftOf(key));var cur=eff(key,l,auto);
  S.manual[key]=S.manual[key]||{};S.manual[key][l]=!cur;save();updateChips(key);return;
 }
 if(act==="copy"){var ta=$("ta-"+key);copyFrom(ta.value,ta,"st-"+key);return;}
 if(act==="savep"){
  var e2=STEPS[key],s2=e2.s,ta2=$("ta-"+key),text=ta2.value.trim(),au=detect(text);
  if(text.length<(s2.min||10)){say("st-"+key,"Schrijf nog wat meer. Een goede prompt is meestal een of twee zinnen.");return;}
  if(s2.forbid&&s2.forbid.some(function(f){return text.indexOf(f)>=0;})){say("st-"+key,s2.forbidMsg);return;}
  var miss=(s2.need||[]).filter(function(l2){return !eff(key,l2,au);});
  if(miss.length){say("st-"+key,"Nog niet klaar. Er mist nog: "+miss.map(function(l3){return LAYERS[l3].n.toLowerCase()+". "+LAYERS[l3].hint;}).join(" "));return;}
  S.drafts[key]=text;S.done[key]=true;
  var entry={key:key,lesson:e2.L.id,title:s2.title,text:text,d:new Date().toISOString()};
  var found=false;S.log=S.log.map(function(x){if(x.key===key){found=true;return entry;}return x;});if(!found)S.log.push(entry);
  save();render(true);return;
 }
 if(act==="off"){if(S.done[key])delete S.done[key];else S.done[key]=true;save();render(true);return;}
 if(act==="rc"){var a=S.ans[key]||{c:null,t:""};a.c=i;S.ans[key]=a;save();render(true);return;}
 if(act==="rsave"){
  var s3=STEPS[key].s,a3=S.ans[key]||{c:null,t:""},ta3=document.querySelector("textarea[data-rkey=\""+key+"\"]");if(ta3)a3.t=ta3.value;
  if(s3.choices&&s3.choices.length){if(a3.c===null){say("st-"+key,"Kies eerst een antwoord.");return;}}
  else if((a3.t||"").trim().length<5){say("st-"+key,"Schrijf nog wat meer op.");return;}
  S.ans[key]=a3;S.done[key]=true;save();render(true);return;
 }
 if(act==="fsave"){
  var fs=STEPS[key].s,fa=Array.isArray(S.ans[key])?S.ans[key]:[];
  for(var q=0;q<fs.fields.length;q++){if((fa[q]||"").trim().length<3){say("st-"+key,"Vul bij "+fs.fields[q].l+" nog iets in.");return;}}
  S.done[key]=true;save();render(true);return;
 }
 if(act==="chk"){
  var arr=S.checks[key]||[];arr[i]=!arr[i];S.checks[key]=arr;
  var n=STEPS[key].s.items.length,all=true;for(var z=0;z<n;z++){if(!arr[z])all=false;}
  if(all)S.done[key]=true;else delete S.done[key];save();render(true);return;
 }
 if(act==="copylog"){var ent=S.log.filter(function(x){return x.key===key;})[0];if(ent)copyFrom(ent.text,null,"logst");return;}
 /* speeltuin */
 if(act==="theme"){S.story.theme=b.getAttribute("data-k");S.story.themeSet=true;save();render(true);return;}
 if(act==="scadd"){S.story.scenes.push({text:"",choices:[]});save();render(true);return;}
 if(act==="scdel"){
  if(!b.getAttribute("data-sure")){b.setAttribute("data-sure","1");b.textContent="Zeker? Tik nog eens";return;}
  removeScene(i);save();render(true);return;
 }
 if(act==="chadd"){S.story.scenes[i].choices.push({t:"",to:-1});save();render(true);return;}
 if(act==="chdel"){S.story.scenes[i].choices.splice(j,1);save();render(true);return;}
 if(act==="play"){play={at:0,h:[],end:false};render(false);return;}
 if(act==="pstop"){play=null;render(false);return;}
 if(act==="pick"){
  var c=S.story.scenes[play.at].choices[j];
  if(!c||c.to<0||c.to>=S.story.scenes.length){play.h.push(play.at);play.end=true;}
  else{play.h.push(play.at);play.at=c.to;}
  render(false);return;
 }
 if(act==="pback"){if(play.end){play.end=false;play.at=play.h.pop();}else if(play.h.length){play.at=play.h.pop();}render(false);return;}
 if(act==="sharecopy"){copyFrom(JSON.stringify({v:1,title:S.story.title,theme:S.story.theme,scenes:S.story.scenes}),null,"stshare","Gekopieerd! Plak het in een bericht.");return;}
 if(act==="load"){
  var raw=($("loadta").value||"").trim(),data;
  try{data=JSON.parse(raw);}catch(er){say("stshare","Dit lijkt geen avontuur. Kopieer de hele tekst opnieuw.");return;}
  var clean=sanitize(data);if(!clean){say("stshare","Dit lijkt geen avontuur. Kopieer de hele tekst opnieuw.");return;}
  if(!confirmLoad){confirmLoad=true;say("stshare","Je eigen avontuur wordt vervangen. Tik nog een keer op Laad als je dat wilt.");return;}
  confirmLoad=false;S.story=clean;save();render(true);return;
 }
 if(act==="reset1"){$("resetbox").innerHTML="<p><b>Weet je zeker dat je alles wilt wissen?</b> Dit kan niet ongedaan worden gemaakt.</p><button class=\"primary\" data-act=\"reset2\">Ja, alles wissen</button> <button data-act=\"reset0\">Nee, terug</button>";return;}
 if(act==="reset0"){$("resetbox").innerHTML="<button data-act=\"reset1\">Alles wissen</button>";return;}
 if(act==="reset2"){S=defaults();save();try{localStorage.removeItem(PK);}catch(e){}location.hash="#start";render(false);return;}
});
render(false);
})();

</script>
</body>
</html>
